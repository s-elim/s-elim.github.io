        url: https://nvidia-isaac.github.io/video_to_data/v2d_challenge/
      - label: Video-to-Data project
        url: https://nvidia-isaac.github.io/video_to_data/
      - label: CoRL 2026
        url: https://www.corl.org/
    connects:
      - Learning Manipulation-Sufficient Representations via Outcome Bottlenecks
      - AFFORD-X
      - PRAXIS
      - Future Drive world models
    related:
      - generative-fidelity-vs-policy
    tags:
