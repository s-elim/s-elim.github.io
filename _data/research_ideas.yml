  - id: generative-fidelity-vs-policy
    title: Does generative real-to-sim fidelity predict policy success?
    theme: world-models
    also:
      - data-benchmarks
      - embodied
      - spatial-3d
    status: shaping
    priority: 5
    added: '2026-09-21'
    effort: medium
    risk: medium
    venue: CoRL 2027 or an evaluation paper at ICRA 2028
    summary: >-
      Generative world models are being sold as simulators for robot training, but nobody
      has shown that the fidelity metrics they report, chamfer distance, AbsRel depth error,
      human preference, rank-correlate with closed-loop policy success in the environments
      they generate.
    why: >-
      Atlas reports 25.3 x 10-3 mean AbsRel and a preference win rate, and the V2D challenge
      reports chamfer distance and contact penetration. Both are open-loop appearance and
      geometry metrics. A policy trained in a generated environment cares about something
      else: whether the errors it sees are the errors that change an action. If the rank
      correlation is weak, every leaderboard in generative real-to-sim is optimising a proxy,
      and that is a result worth publishing on its own.
    angle: >-
      Build the measurement rather than another generator. Take one task suite, reconstruct
      each scene at several fidelity levels, from a plain splat of the same frames up to
      a full generative reconstruction, train the same policy in each, and evaluate all
      of them on the real setup. Report open-loop fidelity and closed-loop success as two
      axes and give the rank correlation between them with three or more seeds. The obvious
      objection is cost: this is a matrix of policies, not one policy, and the real-robot
      evaluation is the bottleneck, so the suite has to stay small and the task has to be
      one where a perception error plausibly changes the action, such as a tight-tolerance
      grasp rather than a wide-margin pick. The missing baseline everyone skips, a plain
      reconstruction from the same frames, is the cheapest row in the matrix and the most
      informative.
    questions:
      - >-
        What is the Kendall tau between open-loop reconstruction error and closed-loop success
        across reconstruction methods on a fixed task suite?
      - >-
        Which error mode matters: pose jitter, depth bias, contact error, or the absence
        of real sensor artefacts in generated depth?
      - Does generative gap-filling beat a plain splat of the same frames once the policy,
        not the eye, is the judge?
      - Does the answer hold across embodiments, or is it a property of the gripper tolerance?
    next:
      - >-
        Pick the task suite and the fidelity ladder; the ladder needs at least a plain splat,
        a generative reconstruction and a clean-multi-view upper bound.
      - Write down the correlation protocol before running anything, including how many
        seeds and how success is aggregated.
      - Check whether the V2D released error distributions can supply the corruption levels
        without re-deriving them.
    source:
      kind: self
      author: Md Selim Sarowar
      label: Raised by the Atlas teardown and the V2D challenge tier structure
