# ==========================================================================
#  Research Ideas - data source for the /research-ideas/ board and mind map
# ==========================================================================
#
#  Rendered by _pages/research-ideas.html, driven by initResearchIdeas() in
#  assets/js/main.js, styled by _sass/theme/_research-ideas.scss. The home page
#  hero reads the same list for its counter chip. Nothing here appears in the
#  main navigation: the page is reached from the hero and from Cmd/Ctrl-K.
#
#  This file is a capture log, not a claim. An entry records where an idea came
#  from, what it would take to test it, and what is still unknown. Publication
#  status lives in publications.yml and is never implied here.
#
#  Add an idea with:  ./scripts/manage.py add-idea
#  (or by hand, newest first, following the schema below)
#
#  themes
#  ------
#  The ring of the mind map and the colour of every card. Order here is the
#  order around the map, clockwise from the top.
#    id     Slug used by `theme`, `also` and the filter pills.
#    label  Display name.
#    icon   Font Awesome 5 free-solid class (fa-globe, fa-robot, ...).
#    color  Hex used for the card accent and the map node. Pick something
#           distinguishable from its neighbours in both light and dark mode.
#    blurb  One line shown in the map legend and the filter tooltip.
#
#  ideas
#  -----
#    id        Stable slug. Anchor (#idea-<id>), map node id, `related` target.
#              Never reuse or rename one: links break.
#    title     Short claim or question. This is the map label, so keep it tight.
#    theme     Primary theme id. Drives colour and map placement.
#    also      Secondary theme ids. Rendered as extra edges on the map.
#    status    spark    captured, not yet examined
#              shaping  being framed into a question
#              active   being worked right now
#              parked   deliberately on hold, with a reason in `angle`
#              shipped  turned into a manuscript or a repository
#    priority  1-5. 5 = drop other things for it. Drives the sort.
#    added     YYYY-MM-DD the idea was captured.
#    effort    low | medium | high   Honest cost to a first result.
#    risk      low | medium | high   Chance the idea does not survive contact.
#    venue     Candidate target, free text. A target, never a claim.
#    summary   One or two sentences. What the idea is.
#    why       What gap it addresses and why it is worth compute.
#    angle     Your own attack on it, including what makes it hard for you
#              specifically. Write the objection you already expect.
#    facts     Verified detail from the source, as label/value pairs. Only
#              things you actually read; put anything uncertain in `questions`.
#    questions Open research questions, most decision-relevant first.
#    next      Concrete next actions. Each one should fit in a day.
#    source    Where it came from.
#                kind      linkedin | arxiv | paper | talk | lab | self | web
#                author    Who said it.
#                label     Human-readable description of the source.
#                url       Link to the source.
#                captured  YYYY-MM-DD you read it.
#    links     Extra references, as label/url pairs.
#    connects  Your own projects or papers this touches, as plain labels.
#    related   ids of other ideas. Renders as a dashed cross-link on the map.
#    tags      Free keywords. Searched, not displayed as filters.
#    note      Caveat printed at the bottom of the card. Use it for anything
#              you have not verified.
# ==========================================================================

