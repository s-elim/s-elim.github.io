  - id: world-labs-atlas
    title: World Labs Atlas
    subtitle: The world model World Labs says will power future versions of Marble
    kicker: 'World model · 21 Sep 2026'
    read: 15 min
    summary: >-
      World Labs released Atlas as a blog post with no paper, no code and no evaluation artifacts.
      This teardown walks the whole machine anyway, from what a world model is asked to do, through
      a multimodal autoregressive diffusion transformer and its rectified-flow sampler, to the
      splat a robot is driven through, and marks every claim as disclosed, inferred or speculative.
    verdict: >-
      The evidence supports two things: native pose conditioning beats text-prompted camera control,
      and Atlas is competitive to modestly better at posed sparse-view pointmap prediction. It
      does not support drift-free generation, general superiority over the reconstruction baselines,
      or dynamics simulation. Atlas has no action input, so it is a geometry-grounded renderer
      and state estimator rather than an interactive simulator, and the articulated and deformable
      behaviour in the demos belongs to a separate physics layer.
    highlights:
      - >-
        The preference study gave Atlas native camera paths and every baseline a text description
        of the path, which World Labs acknowledges, so it measures the input format as much as
        the generator.
      - >-
        Only one reconstruction baseline is labelled as posed, and against that one the margin
        is 25.3 against 28.7 with a tie on Tanks and Temples.
      - >-
        No consistency metric is reported for the one-minute demo: no revisit PSNR, no loop-closure
        error. A controlled revisit test would settle it.
      - >-
        At roughly 14,400 tokens per 1440p frame, a minute of video is about 5.2M tokens, so the
        scene has to be produced in chunks from a selected context.
    page: /notes/atlas/
    tags:
