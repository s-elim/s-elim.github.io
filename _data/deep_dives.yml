    idea: video-for-policy-wam
  - id: v-jepa-latent-world-models
    title: V-JEPA
    subtitle: From masked video pretraining to action-conditioned latent world models, with DINO-WM
      and LeWM alongside
    kicker: 'Latent world models · 21 Sep 2026'
    read: 20 min
    summary: >-
      A joint-embedding predictive architecture predicts in a space it invented, which is why
      it is cheap to run and hard to evaluate. This teardown walks the line from I-JEPA to V-JEPA
      2-AC and LeWM: what tube masking actually forces the encoder to learn, how collapse is avoided
      and what each mechanism costs, how actions get into the predictor, how rollout error compounds,
      and what planning costs on the hardware you own.
    verdict: >-
      The efficiency claims are well supported and the generality claims are not. V-JEPA pretraining
      yields a state encoder, not a transition model, and the world model only appears at the
      action-conditioned stage. Low latent prediction error certifies nothing on its own: it is
      measured in a space the model chose, it weights every dimension equally, and it says nothing
      about the off-manifold behaviour a planner will find and exploit. Latent fidelity, controllability,
      energy-landscape quality and closed-loop success are four separate axes, and papers in this
      line routinely report only the first.
    highlights:
      - >-
        Tube masking is an anti-shortcut device: the page computes, live, what fraction of masked
        tokens could simply be copied from t plus or minus one under each strategy.
      - >-
        SIGReg removes the EMA, the stop-gradient and the pretrained encoder, at the price of
        forcing every latent dimension to carry unit variance, which is why LeWM underperforms
        on Two-Room.
      - >-
        Teacher forcing trains the predictor only on the data manifold, so the Lipschitz constant
        off it, the thing that governs drift, is uncontrolled. Everyone hides this behind short
        horizons and replanning.
      - >-
        The planning budget is arithmetic, not opinion: roughly 2.5e15 FLOPs per action for V-JEPA
        2-AC under illustrative CEM settings against about 2.7e12 for LeWM, which is the whole
        edge-deployment story in two numbers.
    page: /notes/v-jepa/
    tags:
