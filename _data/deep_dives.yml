  - id: v-jepa-latent-world-models
    title: V-JEPA 2 and V-JEPA 2-AC
    subtitle: Masked video prediction in feature space, then an action-conditioned predictor that plans on
      a real Franka arm
    kicker: 'Latent world models · 22 Sep 2026'
    read: 40 min
    summary: >-
      V-JEPA 2 learns a video encoder by predicting masked tubes of video in a feature space it invents;
      V-JEPA 2-AC freezes that encoder, trains a 300M block-causal predictor on under 62 hours of DROID and
      plans with the cross-entropy method on Franka arms in two unseen labs. This teardown checks every number
      against the paper, the released code and V-JEPA 2.1, measures what the masking sampler actually hides,
      audits the robot evidence with the intervals the paper leaves out, ends in a sixteen-step 3D tour with a
      story mode, and turns the setup's eight assumptions into research directions for dexterous hands,
      bimanual arms, mobile manipulators and humanoids.
    verdict: >-
      The representation claims are well supported where the protocol is shared: a 20-point frozen-probe lead
      on SSv2 over the best image encoder. The planning claims are real and thin: 10 trials per cell, one model,
      a camera position tuned by hand, a planner that looks one step ahead, and sub-goal images supplied by a
      person for the only multi-stage task. At n = 20 per task, V-JEPA 2-AC separates from Octo on four of seven
      tasks. The world model infers its action frame from a fixed view with an error that grows linearly with
      camera angle, which is the assumption that blocks mobile and humanoid use first.
    highlights:
      - >-
        Running the released sampler: the short-range and long-range masks hide 62% and 81% of tokens per clip,
        and after the collator truncates to the batch minimum the encoder sees 25% and 6%, not the "about 90%"
        usually quoted.
      - >-
        V-JEPA 2 fixes the EMA at 0.99925; every deployed plan uses horizon 1 with 800 samples, top 10 and 10
        iterations, about 1.2e15 FLOPs and 16 s per action on an RTX 4090.
      - >-
        The Epic-Kitchens anticipation gain is mostly encoder semantics (39.1 from the encoder alone, 39.7 with
        the predictor), and PerceptionTest 84.0 is fine-tuned while its comparison rows are zero-shot.
      - >-
        The one energy landscape in the paper has its minimum on the edge of the swept square and spans about
        10% of its level, and the paper's "L1-ball of radius 0.075" only yields its stated 13 cm step if it is
        the per-axis box the code implements.
    page: /notes/v-jepa/
