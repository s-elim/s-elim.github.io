# ==========================================================================
#  Deep Dives - long reads that get their own box on /research-ideas/
# ==========================================================================
#
#  Rendered by _pages/research-ideas.html, styled in _sass/theme/_research-ideas.scss.
#  A dive is a report I wrote about someone else's system: what it is, what the
#  evidence supports, and what it would take to change the verdict. The idea it
#  raises lives in research_ideas.yml and links back here.
#
#  id        Stable slug, used by the anchor.
#  title     The system under the microscope.
#  subtitle  One line naming what it is, no hype.
#  kicker    Short label: domain, then the date I wrote it.
#  read      Rough reading time.
#  summary   Two or three sentences. What the report covers.
#  verdict   The calibrated read. What the evidence does and does not support.
#  highlights Three or four findings, each one sentence.
#  page      Where the interactive explainer lives on this site.
#  cta       Optional button label; defaults to "Open the teardown".
#  verdict_label Optional label for the verdict box; defaults to "Calibrated verdict".
#  tags      Free keywords.
#  source    The primary source: label, url, date.
#  links     Further reading, as label/url pairs.
#  idea      id of the research_ideas.yml entry this report produced, if any.
# ==========================================================================

dives:
  - id: mujoco-course
    title: MuJoCo, from Zero to Research
    subtitle: An interactive course that runs MuJoCo 3.14.0 in the browser, from a falling ball to
      research-grade robot-learning experiments
    kicker: 'Simulation course · 3 Oct 2026'
    cta: Open the course
    verdict_label: Status
    summary: >-
      Twenty-three levels take MuJoCo from what a simulator computes, through MJCF, the Python and JavaScript
      bindings and rigid-body mechanics, to controllers, contact, Gymnasium, reinforcement and imitation learning,
      vision, language conditioning, world models, domain randomization, system identification and sim-to-real.
      Every lab is MuJoCo itself, compiled to WebAssembly and running in the page, and every measured number in the
      text comes from a script in the companion repository.
    verdict: >-
      Levels 0 to 4 (17 lessons), the playground, the physics, performance and debugging labs, research mode, the
      reading list, the final exam and 2 of 20 projects are written and tested. Levels 5 to 22 have fixed outlines
      and objectives but no lesson text yet, and projects 3 to 20 have specifications without code; each page says
      which state it is in.
    highlights:
      - >-
        Claims carry their kind: established MuJoCo behaviour, derivation, implementation detail, engineering
        recommendation or research-level interpretation, with anything unconfirmed marked unverified.
      - >-
        Measured, not paraphrased: a resting ball sinks 0.37 mm into the floor at 2 kg and at 0.1 kg alike,
        because MuJoCo specifies soft contacts as a reference acceleration rather than a force.
      - >-
        A pytest suite checks every lesson script, model, broken-model case and project solution against
        MuJoCo 3.14.0, and a content checker flags any lesson whose embedded code differs from its source file.
      - >-
        The thirteen-case debugging clinic walks symptom, diagnosis, root cause, fix and lesson for common
        faults such as degrees read as radians, xyzw quaternions and stale observations after reset.
    page: /learn/mujoco/
    tags: [mujoco, simulation, robot-learning, webassembly, course]
    links:
      - label: MuJoCo documentation
        url: https://mujoco.readthedocs.io/en/stable/
      - label: google-deepmind/mujoco
        url: https://github.com/google-deepmind/mujoco

  - id: physics-priors-course
    title: Physics Priors in Machine Learning
    subtitle: A five-lecture PhD course from UniTrento and TUM, rebuilt as a study guide to where physics
      enters a network and what it buys
    kicker: 'Physics-informed ML · 1 Oct 2026'
    read: 50 min
    cta: Open the study guide
    summary: >-
      Mattia Piccinini and Gastone Pietro Rosati Papini's July 2026 course sorts every way of adding physics to a
      learned model by where the prior enters: the inputs (physics-guided), the architecture (physics-encoded) or
      the loss (physics-informed). This guide walks the three routes with their equations, from PINNs, Lagrangian
      and Hamiltonian networks and Neural ODEs to the lecturers' model-structured networks and the nnodely
      library, reads the racing case studies against their own tables, and adds four labs that run in the page and
      a timestamp for every topic in the 8 h 38 min of video.
    verdict: >-
      The course gives a usable map and one fully worked method with open code. Its evidence supports a narrow
      claim well: architectures shaped by the equations of motion fit vehicle dynamics and steering from a lap or
      less of real data better than small general-purpose networks, on held-out laps of the same car, and the
      steering model barely moves across 10 seeds. It does not yet show closed-loop gains on track, better
      zero-shot transfer (after a tyre change the structured model was the worst of three until fine-tuned on
      20 s of data), or more than a 3% ADE gain from the physics loss inside a 4B VLA, reported without seeds.
    highlights:
      - >-
        The boundary rule that makes the taxonomy usable: preprocessing must be frozen or pre-trained to count as
        physics-guided; once it trains with the model, the method is physics-encoded.
      - >-
        A neural compositional module is a scheduled Hammerstein-FIR local-model network: a static input map,
        partition-of-unity regime weights, an FIR layer whose trained weights read as an impulse response and
        expose dead time, and a residual.
      - >-
        Window length comes from the residual spectrum: content below 3 Hz gave 1.25 s of history at 20 Hz
        (n = 25), and residual power below the noise floor flags overfitting.
      - >-
        A controller trained by backpropagating a tracking loss through a frozen learned simulator needs no new
        data and inherits every simulator error; in the page's fourth lab a simulator 40% too light turns 3.3%
        overshoot into 13.7% on the real plant.
    page: /notes/physics-informed-ml/
    tags:
      - physics-informed ML
      - PINN
      - Lagrangian and Hamiltonian networks
      - Neural ODE
      - model-structured networks
      - nnodely
      - system identification
      - evaluation
    source:
      label: 'Piccinini and Rosati Papini, Physics-Informed Machine Learning for Modeling, Planning, Control and Estimation of Physical Systems (PhD course, 5 lectures)'
      url: https://www.youtube.com/playlist?list=PLcgrvuVJuClg
      date: 6 to 10 Jul 2026
    links:
      - label: Course page and slides
        url: https://mattiapiccinini95.github.io/teaching/
      - label: 'Code: tonegas/nnodely'
        url: https://github.com/tonegas/nnodely
      - label: 'Code: nnodely-applications'
        url: https://github.com/tonegas/nnodely-applications
      - label: 'Faroughi et al. taxonomy (arXiv 2211.07377)'
        url: https://arxiv.org/abs/2211.07377
    idea: structured-ego-dynamics-wm
  - id: nvidia-cosmos-3
    title: NVIDIA Cosmos 3
    subtitle: One Mixture-of-Transformers for a VLM, a video and audio generator, forward and inverse
      dynamics, and a robot policy
    kicker: 'World-action models · 22 Sep 2026'
    read: 35 min
    summary: >-
      Cosmos 3 folds NVIDIA's Predict, Transfer and Reason model lines into one set of weights and makes
      action a first-class modality. This teardown walks the mechanism token by token: two parameter towers
      that meet only in attention, a causal-and-full attention mask, a frozen video VAE at 4×32×32, a 3D RoPE
      whose clock puts video, audio and action on one physical time axis, rectified flow matching with a noise
      level per modality, and one action interface for six embodiments. It ends in a fourteen-step 3D tour
      and a story-mode run.
    verdict: >-
      The architecture is well documented and the policy result holds on its own terms: 39.7% against 28.1%
      for π0.5 on 120 RoboLab tasks, and first place on RoboArena and MolmoSpaces, all on the Franka-DROID
      embodiment it trained on. The generation claims rest on margins under one point, a swapped judge,
      LLM-rewritten prompts and snapshot arenas, and human raters still rank Veo 3.1 above it. Nothing in the
      report measures what the world-model framing promises: no policy trained on generated data, no
      simulator-versus-real rank correlation, and no test of whether the video the policy predicts helps the
      action it takes. As a simulator, Nano runs about 4× slower than real time at 480p on a B200.
    highlights:
      - >-
        Reasoner and generator are trained in stages, not jointly, and the generator reads the reasoner only
        through cached keys and values; "think before it acts" is the causal mask plus an optional prompt
        upsampler.
      - >-
        A 5-second 720p clip is 31 latent frames of 23×40 tokens, 28,520 in all, because the released pipeline
        rounds the odd 45-row latent height up; the 74,000-token context caps 720p at 300 frames.
      - >-
        The #1 open-weight text-to-image arena entry was a loop with GPT-5.5 rewriting prompts and Gemini 3.1
        Pro judging, not the checkpoint alone.
      - >-
        The DROID policy denoises future video alongside every 32-step action chunk and then discards it; the
        report never trains the policy without it.
    page: /notes/cosmos3/
    tags:
      - world models
      - world-action models
      - VLA
      - mixture-of-transformers
      - flow matching
      - evaluation
    source:
      label: 'Cosmos 3: Omnimodal World Models for Physical AI (arXiv 2606.02800v4)'
      url: https://arxiv.org/abs/2606.02800
      date: 23 Jun 2026
    links:
      - label: 'Code: NVIDIA/cosmos'
        url: https://github.com/nvidia/cosmos
      - label: 'Weights: Cosmos3-Nano'
        url: https://huggingface.co/nvidia/Cosmos3-Nano
      - label: 'Weights: Cosmos3-Nano-Policy-DROID'
