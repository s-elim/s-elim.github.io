#  percentile  Category percentile band, e.g. "Top 1%".
#  quartile    JCR quartile. Every entry here is Q1 by design.
#  fields      Topic tags shown on the card. Optional.
#
#  ISSN and publisher verified against the Crossref REST API on 2026-08-31.
#  JIF and percentile carried over from the curated SCIE-Q1 table this page
#  replaces. Confirm current values in JCR before citing them anywhere formal.
# ==========================================================================


