# ==========================================================================
#  AI Conference Deadlines - data source for the /deadlines/ tracker
# ==========================================================================
#
#  Rendered by _pages/deadlines.html and driven by initDeadlineTracker() in
#  assets/js/main.js. The home page hero reads the same list for its badge.
#
#  Fields
#  ------
#  name       Conference acronym shown on the card (e.g. CVPR).
#  edition    Year label rendered next to the name.
#  category   robotics | vision | aiml | hci  (drives the filter pills and colour)
#  rank       CORE rank: "A*", "A", "B" ... omit for unranked venues.
#  location   Host city / country as plain text. "TBA" when unannounced.
#  flag       Country flag emoji. Omit when the host country is unknown.
#  dates      When the conference itself runs, as free text.
#  website    Call-for-papers or conference URL.
#  note       Optional caveat shown on the card (e.g. dates not yet official).
#  timeline   Ordered list of dated stages. At least one entry.
#               label  Stage name (Paper Submission, Rebuttal Ends, ...).
#               date   YYYY-MM-DD, or "tba" when the call is not out yet.
#               time   Optional clock time "HH:MM" (defaults to 23:59).
#               tz     Optional timezone, shown after the date. The countdown
#                      reads date and time in this zone, so it ends at the same
#                      instant for every viewer. Understood: AoE, UTC, GMT,
#                      UTC+H or UTC-H[:MM], PST, PDT, PT, EST, EDT, ET, CET,
#                      CEST, BST, JST, KST. Without tz, or with any other
#                      label, the viewer's own clock is used.
#
#  The card counts down to the FIRST stage still in the future. Earlier stages
#  render as done, later ones as upcoming. Adding an abstract, rebuttal or
#  notification date is just another `timeline` entry - no code change needed.
#
#  Scope
#  -----
#  Every CORE A* and A ranked venue in AI, computer vision & graphics, HCI and
#  the ML-adjacent data-mining / IR fields. CORE A*/A venues in systems,
#  networking, security, software engineering, theory and database internals
#  are deliberately left out - they are not what this page is for. Three
#  CORE-unranked venues (CoRL, 3DV, Humanoids) are kept anyway because they
#  are central to robot learning and 3D vision.
#
#  A venue whose current call has closed carries the NEXT edition with a
#  `tba` stage and a note recording the cycle that just ended, so nothing here
#  asserts a date that has not been published.
#
#  Verified 2026-09-22 against official conference sites. The ccf-deadlines
#  dataset (github.com/ccfddl/ccf-deadlines) was used only to find candidates;
#  no date here rests on it alone. Re-check before you submit.
# ==========================================================================

