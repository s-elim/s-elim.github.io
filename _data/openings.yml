    description: "Computer Vision and Geometry Group Our Team Research Publications Lectures News Events Opportunities Welcome To Computer Vision and Geometry Group Welcome to the website of the ETH Computer Vision and Geometry group.\n                        The CVG group is part of the Institute for Visual Computing (IVC). Computer Vision & Geometry Group. Welcome to the website of the ETH Computer Vision and Geometry group.\n                     The CVG group is part of the Institute for Visual Computing (IVC).\n                     Our research and education focuses on computer vision with a particular focus on\n                     geometric aspects. Our goal is to study and develop techniques to extract 3D shape, motion,\n                     appearance and calibration information from images. Specifically, our group is working on the problems of structure-from-motion, self-calibration, photometric calibration, camera networks, stereo and rectification, shape-from-silhouettes, multi-view\
