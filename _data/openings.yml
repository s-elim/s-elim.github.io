                           The CVG group is part of the Institute for Visual Computing (IVC).
                           Our research and education focuses on computer vision with a particular focus on
                           geometric aspects. Our goal is to study and develop techniques to extract 3D shape, motion,
                           appearance and calibration information from images. Specifically, our group is working on the problems of structure-from-motion, self-calibration, photometric calibration, camera networks, stereo and rectification, shape-from-silhouettes, multi-view matching, 3D modeling and image-based representations. We aim to develop new theories and algorithms, as well as systems and applications. Our current focus is on mobile computer vision and modeling large-scale scenes and dynamic events. Meet the Team Featured Research Geometry Line Features and Hybrid Methods Line features for 3D reconstruction and visual localization. Read More 3D Scenes 3D Reconstruction 3D dense reconstruction from RGB-(D) images or point clouds. Read More Geometry General Robust Estimati
