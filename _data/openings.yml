                              The CVG group is part of the Institute for Visual Computing (IVC). Computer Vision & Geometry Group. Welcome to the website of the ETH Computer Vision and Geometry group.
                           The CVG group is part of the Institute for Visual Computing (IVC).
                           Our research and education focuses on computer vision with a particular focus on
                           geometric aspects. Our goal is to study and develop techniques to extract 3D shape, motion,
                           appearance and calibration information from images. Specifically, our group is working on the problems of structure-from-motion, self-calibration, photometric calibration, camera networks, stereo and rectification, shape-from-silhouettes, multi-view matching, 3D modeling and image-based representations. We aim to develop new theories and algorithms, as well as systems and applications. Our current focus is on mobile computer vision and modeling large-scale scenes and dynamic events. Meet the Team Featured Research Geometry Image Matching Point correspondences for visual localization and mapping. Read More 3D Scenes Parameteric Scene Representations Reconstruction of vectorized CAD models and parametric representations from 3D scans. Read More Geometry Li
