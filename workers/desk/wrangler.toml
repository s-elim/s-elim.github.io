# Only needed if you deploy from a terminal with `npx wrangler deploy`.
# The dashboard route in README.md needs no local tooling at all.
name = "homepage-desk"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://s-elim.github.io"

# `npx wrangler d1 create desk`, then paste the id it prints.
[[d1_databases]]
binding = "DB"
database_name = "desk"
database_id = "REPLACE_WITH_THE_ID_FROM_wrangler_d1_create"

# Secrets are never written here. Set them with:
#   npx wrangler secret put DESK_PASSPHRASE
#   npx wrangler secret put NOTION_TOKEN
#   npx wrangler secret put GOOGLE_BRIDGE_URL
#   npx wrangler secret put GOOGLE_BRIDGE_SECRET
