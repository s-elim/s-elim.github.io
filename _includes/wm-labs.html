{%- comment -%}
  Labs 1 to 8 of the latent world model lecture. Plain JavaScript on canvas and
  SVG, using the helpers in window.WM.u (wm-core.html). Samplers and formulas
  are ported from facebookresearch/vjepa2 @ 204698b where the lab says so.
{%- endcomment -%}
<script>
(function () {
  'use strict';
  var WM = window.WM; if (!WM || !WM.u) return;
  var U = WM.u, $ = U.$, $$ = U.$$, byId = U.byId, setText = U.setText, clamp = U.clamp, esc = U.esc, rng = U.rng, gauss = U.gauss, col = U.col, alpha = U.alpha, cv = U.cv, font = U.font, reg = U.reg, bind = U.bind, val = U.val, chips = U.chips;
  var doc = document;
  // narrow screens get a taller canvas; returns true when narrow
  function shape(el, wide, narrow) { var n = (el.clientWidth || el.width) < 520; el.dataset.aspect = String(n ? narrow : wide); return n; }
  function axes(c, C, L, T, W, H, xl, yl) { c.strokeStyle = C.line; c.lineWidth = 1; c.strokeRect(L, T, W, H); font(c, 10.5, true); c.fillStyle = C.ink3; if (xl) { c.textAlign = 'right'; c.fillText(xl, L + W, T + H + 16); } if (yl) { c.textAlign = 'left'; c.fillText(yl, L + 4, T - 6); } }

  /* ---- Lab 1: pixels or features ------------------------------------------- */
  (function pix() {
    var el = byId('pix-cv'); if (!el) return;
    var N = 64;
    function dctBasis() { var B = []; for (var k = 0; k < N; k++) { var row = []; for (var i = 0; i < N; i++) row.push(Math.sqrt((k === 0 ? 1 : 2) / N) * Math.cos(Math.PI / N * (i + 0.5) * k)); B.push(row); } return B; }
    var Bs = dctBasis();
    function bump(c) { var v = []; for (var i = 0; i < N; i++) { var d = Math.min(Math.abs(i - c), N - Math.abs(i - c)); v.push(Math.exp(-d * d / (2 * 3 * 3))); } return v; }
    function lowpass(v, B) { var out = new Array(N).fill(0); for (var k = 0; k < B; k++) { var a = 0; for (var i = 0; i < N; i++) a += Bs[k][i] * v[i]; for (i = 0; i < N; i++) out[i] += a * Bs[k][i]; } return out; }
    function mse(a, b) { var s = 0; for (var i = 0; i < N; i++) s += (a[i] - b[i]) * (a[i] - b[i]); return s / N; }
    function update() {

      var r = rng(3), c0 = 20, mean0 = bump(c0), mean1 = bump(c0 + sp), f0 = mean0.map(function (x) { return x + nz * gauss(r); }), f1 = mean1.map(function (x) { return x + nz * gauss(r); });
      // an imperfect model that has not learned the motion predicts the last frame's mean
      var fixP = mse(mean0, mean1), irrP = nz * nz, lp0 = lowpass(mean0, B), lp1 = lowpass(mean1, B), fixF = mse(lp0, lp1), irrF = nz * nz * B / N;
      setText('pix-fix', fixP.toFixed(3)); setText('pix-irr', irrP.toFixed(3)); setText('pix-share', Math.round(100 * irrP / Math.max(1e-9, fixP + irrP)) + '%'); setText('pix-feat', (fixF + irrF).toFixed(3));
      byId('pix-share').parentNode.className = 'read' + (irrP / Math.max(1e-9, fixP + irrP) > 0.5 ? ' is-bad' : '');
      var st = byId('pix-status');
      st.textContent = 'Pixel loss of a model that ignores motion: ' + (fixP + irrP).toFixed(3) + ', of which ' + Math.round(100 * irrP / Math.max(1e-9, fixP + irrP)) + '% is flicker no model can predict. In the ' + B + '-coefficient feature space the flicker share is ' + Math.round(100 * irrF / Math.max(1e-9, fixF + irrF)) + '%.';
      var nw = shape(el, 520 / 900, 1.05), g = cv(el), cc = g.c, C = col(), W = g.w, H = g.h, L = nw ? 10 : 40, Rr = nw ? 8 : 12, rows = [[nw ? 'frame t' : 'frame t (observed)', f0, C.ink2], [nw ? 'frame t+1' : 'frame t+1 (observed)', f1, C.ink2], [nw ? 'best pixel prediction' : 'E[frame t+1 | past]: the best any pixel model can do', mean1, C.blue], [nw ? 'feature space, frame t+1' : 'feature space: frame t+1 through the encoder', lowpass(f1, B), C.red]];
      var rh = (H - 30) / rows.length;
      rows.forEach(function (rw, k) {
        var top = 14 + k * rh, mid = top + rh * 0.6, amp = rh * 0.3;
        cc.strokeStyle = C.line; cc.beginPath(); cc.moveTo(L, mid); cc.lineTo(W - Rr, mid); cc.stroke();
        font(cc, 11, true); cc.fillStyle = C.ink3; cc.textAlign = 'left'; cc.fillText(rw[0], L, top + 10);
        cc.strokeStyle = rw[2]; cc.lineWidth = 2; cc.beginPath();
        rw[1].forEach(function (v, i) { var x = L + i / (N - 1) * (W - L - Rr), y = mid - clamp(v, -1.5, 1.5) * amp; if (i) cc.lineTo(x, y); else cc.moveTo(x, y); }); cc.stroke();
      });
    }
    bind(['pix-noise', 'pix-speed', 'pix-band'], update); reg(update);
  })();

  /* ---- Lab 2: tokenizer ---------------------------------------------------- */
  (function tok() {
    var el = byId('tok-cv'); if (!el) return;
    var PRE = [['ijepa', 'I-JEPA image', [1, 224, 14, 1, 1280]], ['vj2', 'V-JEPA 2 pretrain', [16, 256, 16, 2, 1408]], ['cool', 'V-JEPA 2 cooldown', [64, 384, 16, 2, 1408]], ['ac', 'V-JEPA 2-AC frame', [1, 256, 16, 2, 1408]], ['hj', 'H-JEPA level 1 (DROID)', [1, 256, 16, 1, 384]]];
    function setPre(k) { var p = PRE.filter(function (x) { return x[0] === k; })[0][2]; byId('tk-T').value = p[0]; byId('tk-R').value = p[1]; byId('tk-p').value = p[2]; byId('tk-t').value = p[3]; byId('tk-d').value = p[4]; update(); }
    chips(byId('tok-pre'), PRE.map(function (p) { return [p[0], p[1]]; }), 'vj2', setPre);
    function update() {
      var T = val('tk-T'), R = val('tk-R'), p = +byId('tk-p').value, t = +byId('tk-t').value, d = +byId('tk-d').value;
      setText('tk-T-o', T); setText('tk-R-o', R); setText('tk-p-o', p); setText('tk-t-o', t); setText('tk-d-o', d);
      var g1 = Math.floor(R / p), tt = t === 2 && T === 1 ? 1 : Math.max(1, Math.floor(T / t)), N = tt * g1 * g1, att = N * N, fl = (24 * N * d * d + 4 * N * N * d) / 1e9;
      setText('tk-N', N.toLocaleString('en-US')); setText('tk-att', att >= 1e6 ? (att / 1e6).toFixed(1) + 'M' : att.toLocaleString('en-US')); setText('tk-fl', fl < 10 ? fl.toFixed(2) : fl.toFixed(0));
      byId('tk-shape').textContent = 'x  (B, 3, ' + T + ', ' + R + ', ' + R + ')' + (t === 2 && T === 1 ? '  duplicate the frame → (B, 3, 2, ' + R + ', ' + R + ')' : '') + '\nConv3d  kernel = stride = (' + t + ', ' + p + ', ' + p + ')  3 → ' + d + '\n→ (B, ' + d + ', ' + tt + ', ' + g1 + ', ' + g1 + ')  flatten → (B, ' + N + ', ' + d + ')';
      var nw = shape(el, 0.66, 1.0), g = cv(el), c = g.c, C = col(), W = g.w, H = g.h, show = Math.min(tt, 8), dx = 18, cell = Math.min((W * 0.55) / Math.max(g1, 1), (H - 84 - 0.6 * dx * (show - 1)) / Math.max(g1, 1)), gw = cell * g1, x0 = nw ? 12 : 30, y0 = H - 64 - gw;
      dx = Math.min(18, (W - gw - x0 - 12) / Math.max(show, 1));
      for (var s = show - 1; s >= 0; s--) {
        var ox = x0 + s * dx, oy = y0 - s * dx * 0.6;
        c.fillStyle = s === 0 ? C.plot : C.s2; c.fillRect(ox, oy, gw, gw); c.strokeStyle = C.line2; c.lineWidth = 1; c.strokeRect(ox, oy, gw, gw);
        if (s === 0 && g1 <= 48) { c.strokeStyle = C.line; for (var i = 1; i < g1; i++) { c.beginPath(); c.moveTo(ox + i * cell, oy); c.lineTo(ox + i * cell, oy + gw); c.stroke(); c.beginPath(); c.moveTo(ox, oy + i * cell); c.lineTo(ox + gw, oy + i * cell); c.stroke(); } }
      }
      c.fillStyle = C.red; c.globalAlpha = 0.85; c.fillRect(x0 + 2 * cell, y0 + 2 * cell, cell, cell); c.globalAlpha = 1;
      font(c, 11, true); c.fillStyle = C.ink2; c.textAlign = 'left';
      c.fillText(g1 + ' × ' + g1 + ' patches per slice', x0, y0 + gw + 18);

      font(c, nw ? 10 : 11, true); c.fillText(sl, x0, y0 + gw + 34); c.fillStyle = C.red; c.fillText(tok, x0, y0 + gw + 50);
    }
    ['tk-T', 'tk-R'].forEach(function (id) { byId(id).addEventListener('input', update); });
    ['tk-p', 'tk-t', 'tk-d'].forEach(function (id) { byId(id).addEventListener('change', update); });
    reg(update);
  })();

  /* ---- Lab 3: rotary positions --------------------------------------------- */
  (function rope() {
    var el = byId('rope-cv'); if (!el) return;
    var mode = 'both';
    chips(byId('rope-mode'), [['both', 'both'], ['intended', 'intended'], ['code', 'as implemented']], mode, function (m) { mode = m; update(); });
    function rot(x, p, D, code) {
      var h = D / 2, out = new Array(D);
      for (var j = 0; j < D; j += 2) {
        var wa = code ? Math.pow(10000, -((j) % h) / h) : Math.pow(10000, -(j / 2) / h), wb = code ? Math.pow(10000, -((j + 1) % h) / h) : wa;
        var a = p * wa, b = p * wb;
        out[j] = x[j] * Math.cos(a) - x[j + 1] * Math.sin(a);
        out[j + 1] = x[j + 1] * Math.cos(b) + x[j] * Math.sin(b);
      }
      return out;
    }
    function dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
    function update() {
      var D = val('rp-D'), base = val('rp-b'), sd = val('rp-s'); setText('rp-D-o', D); setText('rp-b-o', base); setText('rp-s-o', sd);
      var r = rng(sd * 7919), q = [], k = []; for (var i = 0; i < D; i++) { q.push(gauss(r)); k.push(gauss(r)); }
      var offs = []; for (var o = 0; o <= 15; o++) offs.push(o);
      function curve(code, p0) { return offs.map(function (o) { return dot(rot(q, p0, D, code), rot(k, p0 + o, D, code)); }); }
      var ci0 = curve(false, 0), ci1 = curve(false, base), cc0 = curve(true, 0), cc1 = curve(true, base);
      var gapI = Math.max.apply(null, ci0.map(function (v, i) { return Math.abs(v - ci1[i]); })), gapC = Math.max.apply(null, cc0.map(function (v, i) { return Math.abs(v - cc1[i]); }));
      var nq = Math.sqrt(dot(q, q)), nC = Math.sqrt(dot(rot(q, 3, D, true), rot(q, 3, D, true))) / nq, nI = Math.sqrt(dot(rot(q, 3, D, false), rot(q, 3, D, false))) / nq;
      setText('rp-gap', mode === 'intended' ? gapI.toFixed(3) : gapC.toFixed(3)); setText('rp-norm', (mode === 'intended' ? nI : nC).toFixed(3) + '×');
      byId('rp-gap').parentNode.className = 'read' + ((mode === 'intended' ? gapI : gapC) > 1e-6 ? ' is-bad' : ' is-good');
      setText('rp-status', 'Intended: the two curves coincide (gap ' + gapI.toExponential(1) + '), so the score depends only on the offset. As implemented: gap ' + gapC.toFixed(3) + ' and the norm changes by ' + nC.toFixed(3) + '×, so it is neither purely relative nor a rotation.');
      var nw = shape(el, 460 / 900, 0.85), g = cv(el), c = g.c, C = col(), W = g.w, H = g.h, L = nw ? 34 : 50, T = 20, PW = W - L - 12, PH = H - T - (nw ? 58 : 40);
      var all = [].concat(mode !== 'code' ? ci0.concat(ci1) : [], mode !== 'intended' ? cc0.concat(cc1) : []), mx = Math.max.apply(null, all.map(Math.abs)) * 1.15 || 1;
      function X(o) { return L + o / 15 * PW; } function Y(v) { return T + PH / 2 - v / mx * PH / 2; }
      axes(c, C, L, T, PW, PH, nw ? 'key − query offset →' : 'offset between key and query positions →', 'q′ · k′');
      c.strokeStyle = C.line; c.beginPath(); c.moveTo(L, Y(0)); c.lineTo(L + PW, Y(0)); c.stroke();
      function line(arr, color, dash) { c.strokeStyle = color; c.lineWidth = 2.2; c.setLineDash(dash || []); c.beginPath(); arr.forEach(function (v, i) { if (i) c.lineTo(X(i), Y(v)); else c.moveTo(X(i), Y(v)); }); c.stroke(); c.setLineDash([]); }
      if (mode !== 'code') { line(ci0, C.blue); line(ci1, C.blue, [6, 4]); }
      if (mode !== 'intended') { line(cc0, C.red); line(cc1, C.red, [6, 4]); }
      font(c, nw ? 9.5 : 10.5, true); c.textAlign = 'left'; var ly = H - 10;
      c.fillStyle = C.blue; if (mode !== 'code') c.fillText((nw ? 'intended' : 'intended: solid from 0') + ', dashed from ' + base, L, nw && mode === 'both' ? ly - 16 : ly);
      c.fillStyle = C.red; if (mode !== 'intended') c.fillText((nw ? 'implemented' : 'as implemented: solid from 0') + ', dashed from ' + base, nw ? L : L + PW / 2, ly);
    }
    bind(['rp-D', 'rp-b', 'rp-s'], update); reg(update);
  })();

  /* ---- Lab 4: mask samplers (ported from src/masks) ------------------------- */
  (function masks() {
    var el = byId('mask-cv'); if (!el) return;
    var mode = 'short', sample = null, seed = 1;
    chips(byId('mask-mode'), [['ijepa', 'I-JEPA (image)'], ['short', 'V-JEPA 2 short-range'], ['long', 'V-JEPA 2 long-range']], mode, function (m) { mode = m; run(); });
    var Tg = 8, Hg = 16, Wg = 16;
    function blockSize(r, scale, ar0, ar1) { var keep = Math.floor(Hg * Wg * scale), ar = ar0 + r() * (ar1 - ar0); return [Math.min(Hg, Math.round(Math.sqrt(keep * ar))), Math.min(Wg, Math.round(Math.sqrt(keep / ar)))]; }
    function vjClip(r, hw, npred) {
      var m = new Uint8Array(Hg * Wg);
      for (var b = 0; b < npred; b++) { var top = Math.floor(r() * (Hg - hw[0] + 1)), left = Math.floor(r() * (Wg - hw[1] + 1)); for (var y = top; y < top + hw[0]; y++) for (var x = left; x < left + hw[1]; x++) m[y * Wg + x] = 1; }
      return m; // 1 = masked, same for every time slice (temporal scale 1.0)
    }
    function ijClip(r) {
      var tgt = new Uint8Array(Hg * Wg), boxes = [];
      for (var b = 0; b < 4; b++) { var hw = blockSize(r, 0.15 + r() * 0.05, 0.75, 1.5), top = Math.floor(r() * (Hg - hw[0] + 1)), left = Math.floor(r() * (Wg - hw[1] + 1)); boxes.push([top, left, hw]); for (var y = top; y < top + hw[0]; y++) for (var x = left; x < left + hw[1]; x++) tgt[y * Wg + x] = 1; }
      var cs = Math.round(Math.sqrt(Math.floor(Hg * Wg * (0.85 + r() * 0.15)))), ct = Math.floor(r() * (Hg - cs + 1)), cl = Math.floor(r() * (Wg - cs + 1)), ctx = new Uint8Array(Hg * Wg);
      for (var yy = ct; yy < ct + cs; yy++) for (var xx = cl; xx < cl + cs; xx++) if (!tgt[yy * Wg + xx]) ctx[yy * Wg + xx] = 1;
      return { tgt: tgt, ctx: ctx };
    }
    function stats(B, n) {
      var r = rng(1000 + seed), mfrac = 0, enc = 0, pred = 0, tot = Tg * Hg * Wg;
      for (var it = 0; it < n; it++) {
        var hw = blockSize(r, mode === 'short' ? 0.15 : 0.7, 0.75, 1.5), npred = mode === 'short' ? 8 : 2, minE = tot, minP = tot, mf = 0;
        for (var b = 0; b < B; b++) { var m = vjClip(r, hw, npred), cnt = 0; for (var i = 0; i < m.length; i++) cnt += m[i]; cnt *= Tg; if (tot - cnt === 0) { b--; continue; } mf += cnt / tot; minP = Math.min(minP, cnt); minE = Math.min(minE, tot - cnt); }
        mfrac += mf / B; enc += minE / tot; pred += minP / tot;
      }
      return [mfrac / n, enc / n, pred / n];
    }
    function run() {
      var B = val('mk-B'); setText('mk-B-o', B);
      var r = rng(seed * 31 + (mode === 'long' ? 7 : 0));
      if (mode === 'ijepa') {
        sample = ijClip(r); var tg = 0, cx = 0; for (var i = 0; i < sample.tgt.length; i++) { tg += sample.tgt[i]; cx += sample.ctx[i]; }
        setText('mk-m', Math.round(100 * tg / 256) + '%'); setText('mk-e', Math.round(100 * cx / 256) + '%'); setText('mk-p', Math.round(100 * tg / 256) + '%');
        setText('mk-status', 'One image: 4 target blocks to predict (red) and the context block with the targets removed (blue). No truncation step in this sketch.');
      } else {
        var hw = blockSize(r, mode === 'short' ? 0.15 : 0.7, 0.75, 1.5), npred = mode === 'short' ? 8 : 2, clips = [];
        for (var b = 0; b < B; b++) clips.push(vjClip(r, hw, npred));
        var tot = Tg * Hg * Wg, minE = tot, minP = tot;
        clips.forEach(function (m) { var c2 = 0; for (var i2 = 0; i2 < m.length; i2++) c2 += m[i2]; c2 *= Tg; minP = Math.min(minP, c2); minE = Math.min(minE, tot - c2); });
        sample = { m: clips[0], minE: minE, minP: minP, hw: hw };
        var s = stats(B, 200);
        setText('mk-m', Math.round(100 * s[0]) + '%'); setText('mk-e', Math.round(100 * s[1]) + '%'); setText('mk-p', Math.round(100 * s[2]) + '%');
        setText('mk-status', 'Block ' + hw[0] + ' × ' + hw[1] + ' tokens, ' + npred + ' per clip, every time slice. Averages over 200 batches of ' + B + ' clips: ' + Math.round(100 * s[0]) + '% masked; after truncation the encoder sees ' + Math.round(100 * s[1]) + '% and ' + Math.round(100 * s[2]) + '% is predicted.');
      }
      draw();
    }
    function draw() {
      var g = cv(el), c = g.c, C = col(), W = g.w, H = g.h;
      if (!sample) return;
      if (mode === 'ijepa') {
        var cs = Math.min((W - 40) / Wg, (H - 40) / Hg), ox = (W - cs * Wg) / 2, oy = 20;
        for (var y = 0; y < Hg; y++) for (var x = 0; x < Wg; x++) { var i = y * Wg + x; c.fillStyle = sample.tgt[i] ? C.red : sample.ctx[i] ? C.blue : C.s2; c.globalAlpha = sample.tgt[i] || sample.ctx[i] ? 0.8 : 1; c.fillRect(ox + x * cs + 1, oy + y * cs + 1, cs - 2, cs - 2); c.globalAlpha = 1; }
        return;
      }
      // eight time slices, showing the batch-minimum truncation in (t, h, w) order
      var cols = 4, rows = 2, gap = 14, cs2 = Math.min((W - gap * (cols + 1)) / (cols * Wg), (H - 50 - gap * (rows + 1)) / (rows * Hg)), sw = cs2 * Wg;
      var keepE = sample.minE, keepP = sample.minP, seenE = 0, seenP = 0;
      for (var t = 0; t < Tg; t++) {
        var gx = gap + (t % cols) * (sw + gap), gy = gap + Math.floor(t / cols) * (sw + gap + 14);
        font(c, 10, true); c.fillStyle = C.ink3; c.textAlign = 'left'; c.fillText('t = ' + t, gx, gy + 9);
        for (var yy = 0; yy < Hg; yy++) for (var xx = 0; xx < Wg; xx++) {
          var mk = sample.m[yy * Wg + xx], color;
          if (mk) { seenP++; color = seenP <= keepP ? C.red : C.line2; } else { seenE++; color = seenE <= keepE ? C.blue : C.line2; }
          c.fillStyle = color; c.globalAlpha = color === C.line2 ? 0.6 : 0.8; c.fillRect(gx + xx * cs2, gy + 14 + yy * cs2, cs2 - 0.6, cs2 - 0.6); c.globalAlpha = 1;
        }
      }
      font(c, 10.5, true); c.textAlign = 'left'; var ly = H - 8;
      var lx = 14, nw = W < 520;
      [[nw ? 'encoder sees' : 'seen by the encoder', C.blue], ['predicted', C.red], [nw ? 'dropped' : 'dropped by batch-minimum truncation', C.ink3]].forEach(function (it) { c.fillStyle = it[1]; c.fillText(it[0], lx, ly); lx += c.measureText(it[0]).width + 18; });
    }
    byId('mk-B').addEventListener('input', run); byId('mk-new').addEventListener('click', function () { seed++; run(); });
    run(); reg(draw);
  })();

  /* ---- Lab 5: collapse in a linear JEPA ------------------------------------- */
  (function collapse() {
    var el = byId('col-cv'); if (!el) return;
    var hist = [], running = false, lastLoss = null;
    function svals(W) { // singular values of a 4 x 8 matrix via Jacobi on W W^T
      var A = [], i, j, k;
      for (i = 0; i < 4; i++) { A.push([]); for (j = 0; j < 4; j++) { var s = 0; for (k = 0; k < 8; k++) s += W[i][k] * W[j][k]; A[i].push(s); } }
      for (var sweep = 0; sweep < 30; sweep++) for (var p = 0; p < 3; p++) for (var q = p + 1; q < 4; q++) {
        if (Math.abs(A[p][q]) < 1e-12) continue;
        var th = 0.5 * Math.atan2(2 * A[p][q], A[q][q] - A[p][p]), cth = Math.cos(th), sth = Math.sin(th);
        for (k = 0; k < 4; k++) { var akp = A[k][p], akq = A[k][q]; A[k][p] = cth * akp - sth * akq; A[k][q] = sth * akp + cth * akq; }
        for (k = 0; k < 4; k++) { var apk = A[p][k], aqk = A[q][k]; A[p][k] = cth * apk - sth * aqk; A[q][k] = sth * apk + cth * aqk; }
      }
      return [0, 1, 2, 3].map(function (d) { return Math.sqrt(Math.max(0, A[d][d])); }).sort(function (a, b) { return b - a; });
    }
    function train() {
      var sg = byId('col-sg').checked, pred = byId('col-pr').checked, m = val('col-m'), wd = val('col-wd');
